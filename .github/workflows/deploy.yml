name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.gitignore']
  workflow_dispatch:

# Права нужны самому GITHUB_TOKEN: pages — публиковать, id-token — получить
# OIDC-токен, которым actions/deploy-pages подтверждает происхождение артефакта.
# Отдельный PAT при таком деплое не нужен.
permissions:
  contents: read
  pages: write
  id-token: write

# Промежуточные сборки отменяем, но начавшийся выкат не трогаем: прерванный
# deploy-pages оставляет окружение github-pages в статусе in_progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}

      # Pages не умеет rewrite, но project site отдаёт собственный 404.html на
      # любой несуществующий путь внутри /media-vault/. Скрипт postbuild кладёт
      # туда копию index.html — этим и живут прямой заход и F5 на /movie/603.
      - name: Verify SPA fallback was built
        run: test -f dist/404.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
